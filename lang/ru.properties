help.header=Работа со схемой · F1
help.text=Блок: перетащите корпус. Связь: синяя точка → зелёный вход.\nСредняя кнопка мыши — переместить полотно. Ctrl+колесо — масштаб у курсора.\nHome — вписать схему. Alt+↑ — родительская папка.\nСтрелки — сдвиг на 12 px; Shift+стрелки — на 1 px.\nCtrl+D — копия, Delete — удалить, Ctrl+Z/Y — история, Ctrl+S — сохранить.\nEsc — отменить связь. Поиск: вкладка слева, Enter — перейти.\nОпции → Настройки: темы, сетка, привязка, значения и интервал обновления в мс.\nОпции → Проект: библиотека шаблонов, импорт/экспорт и сохранение выделения.\nОпции → Устройство: манифесты, сравнение и журнал после сбоя.\nИзменения проекта отправляются на устройство только через «Применить…».
help.title=Управление Sedona Studio

